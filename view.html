<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הקלטת הוובינר | את יודעת הכל - אז למה זה עדיין לא קורה?</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#1B4D3E',
                            light: '#2C6E5A',
                            gold: '#D4AF37',
                            goldLight: '#E5C565',
                            cream: '#FDFBF7',
                            dark: '#333333',
                            muted: '#4A5568',
                        }
                    },
                    fontFamily: {
                        sans: ['Rubik', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'fade-in-up-delay-1': 'fadeInUp 0.8s ease-out 0.2s forwards',
                        'fade-in-up-delay-2': 'fadeInUp 0.8s ease-out 0.4s forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    boxShadow: {
                        'soft': '0 8px 32px rgba(27, 77, 62, 0.08)',
                        'gold': '0 4px 15px rgba(212, 175, 55, 0.3)',
                        'gold-hover': '0 8px 25px rgba(212, 175, 55, 0.4)',
                        'video': '0 20px 60px -10px rgba(27, 77, 62, 0.15)',
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .btn-gradient {
                background: linear-gradient(135deg, #FCE38A 0%, #D4AF37 50%, #997B09 100%);
            }
            .hide-sticky {
                opacity: 0 !important;
                transform: translateY(20px) !important;
                pointer-events: none !important;
            }
        }
    </style>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-brand-cream text-brand-dark font-sans antialiased min-h-screen flex flex-col items-center py-10 pb-32">

    <div class="max-w-[900px] w-full px-6 flex-1 flex flex-col gap-10">
        
        <header class="text-center opacity-0 animate-fade-in-up">
            <h1 class="text-brand-green text-3xl md:text-[42px] font-bold leading-tight mb-4">
                את יודעת הכל - אז למה זה עדיין לא קורה?
            </h1>
            <p class="text-brand-muted text-lg md:text-xl max-w-[680px] mx-auto">
                צפי בהדרכה המלאה וגלי מה באמת עוצר אותך, ואיך לבנות את המערכת שתחזיק גם בימים הקשים.
            </p>
        </header>

        <div class="relative rounded-[20px] p-2.5 bg-white shadow-video opacity-0 animate-fade-in-up-delay-1">
            <div class="relative pb-[56.25%] h-0 bg-black rounded-xl overflow-hidden">
                <iframe 
                    id="vimeo-player"
                    src="https://player.vimeo.com/video/1191447368?badge=0&autopause=0&player_id=0" 
                    class="absolute top-0 left-0 w-full h-full border-0"
                    allow="autoplay; fullscreen; picture-in-picture; clipboard-write" 
                    title="הקלטת מאסטר-קלאס"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="bg-white p-8 md:p-11 rounded-[24px] text-center border border-brand-gold/20 shadow-soft max-w-[650px] mx-auto relative overflow-hidden opacity-0 animate-fade-in-up-delay-2" id="ctaContainer">
            <!-- Top Gradient Border Decoration -->
            <div class="absolute top-0 right-0 w-full h-1 bg-gradient-to-l from-[#D4AF37] to-[#FCE38A]"></div>
            
            <h2 class="text-brand-green text-2xl md:text-[26px] font-bold mt-0 mb-6">
                מוכנה ליישם ולעשות את הצעד הבא?
            </h2>
            
            <a href="https://rivkaholtsberg.co.il/webinarm/hatza" class="inline-flex items-center justify-center min-h-[60px] px-10 py-3 mx-auto w-auto btn-gradient text-white rounded-full text-xl md:text-[22px] font-bold shadow-gold hover:shadow-gold-hover hover:-translate-y-1 transition-all duration-200 gap-3 decoration-transparent">
                כן, אני רוצה להצטרף!
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rtl:-scale-x-100"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            
            <!-- Deadline Note -->
            <div class="text-base text-brand-light mt-5 font-medium flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                שימי לב: ההטבה המיוחדת לרוכשות הוובינר בתוקף לזמן מוגבל
            </div>
        </div>
        
    </div>

    <div id="stickyBtnWrapper" class="fixed bottom-0 left-0 w-full p-4 md:p-6 z-50 flex justify-center pointer-events-none transition-all duration-400 ease-in-out opacity-100 translate-y-0">
        <a href="https://rivkaholtsberg.co.il/webinarm/hatza" class="inline-flex items-center justify-center w-auto px-10 py-3 min-h-[60px] btn-gradient text-white rounded-full text-xl md:text-[22px] font-bold shadow-[0_10px_30px_rgba(27,77,62,0.35)] hover:shadow-[0_12px_35px_rgba(212,175,55,0.4)] hover:-translate-y-1 transition-all duration-200 gap-3 decoration-transparent pointer-events-auto">
            כן, אני רוצה להצטרף!
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rtl:-scale-x-100"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
    </div>

    <!-- Vimeo API -->
    <script src="https://player.vimeo.com/api/player.js"></script>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Logic for hiding the sticky button while playing the video
        const iframe = document.getElementById('vimeo-player');
        const player = new Vimeo.Player(iframe);
        const stickyWrapper = document.getElementById('stickyBtnWrapper');

        // When video plays -> hide button
        player.on('play', function() {
            stickyWrapper.classList.add('hide-sticky');
        });

        // When video is paused -> show button
        player.on('pause', function() {
            stickyWrapper.classList.remove('hide-sticky');
        });

        // When video ends -> show button
        player.on('ended', function() {
            stickyWrapper.classList.remove('hide-sticky');
        });
    </script>
    
    <!-- Legal Footer Script -->
    <script src="https://rivkaol.github.io/legal-footer.js"></script>
</body>
</html>
